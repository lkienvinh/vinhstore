<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Vinh Store</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <main class="register-box">
        <section class="content">
            <a href="index.html" class="brand">VINH STORE</a>

            <h1>Tạo tài khoản</h1>
            <p class="intro">
                Đăng ký để khám phá phong cách của riêng bạn.
            </p>

            <form method="post" class="form">
                <div class="group">
                    <label for="fullname">Họ và tên</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Nhập họ và tên"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="group">
                    <label for="username">Tên đăng nhập</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập tên đăng nhập"
                        autocomplete="username"
                        minlength="3"
                        required
                    >
                </div>

                <div class="group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Nhập địa chỉ email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="password">
                    <div class="group">
                        <label for="password">Mật khẩu</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ít nhất 8 ký tự"
                            autocomplete="new-password"
                            minlength="6"
                            maxlength="18"
                            required
                        >
                    </div>

                    <div class="group">
                        <label for="confirm-password">Nhập lại mật khẩu</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm_password"
                            placeholder="Nhập lại mật khẩu"
                            autocomplete="new-password"
                            minlength="6"
                            maxlength="18"
                            required
                        >
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    <span>
                        Tôi đồng ý với
                        <a href="terms.html">Điều khoản sử dụng</a>
                        và
                        <a href="privacy.html">Chính sách bảo mật</a>.
                    </span>
                </label>

                <button type="submit" class="submit">
                    Đăng ký
                </button>
            </form>

            <p class="link">
                Đã có tài khoản?
                <a href="login.html">Đăng nhập</a>
            </p>

            <a href="index.html" class="backlink">← Về trang chủ</a>
        </section>

        <aside class="image" aria-label="Thời trang Vinh Store">
            <img
                src="img/register-fashion.png"
                alt="Quần áo, giày và phụ kiện của Vinh Store"
            >

            <div class="caption">
                <span>YOUR STYLE, YOUR STORY</span>
                <h2>Phong cách mới.<br>Khởi đầu từ bạn.</h2>
                <p>Cùng Vinh Store hoàn thiện tủ đồ mỗi ngày.</p>
            </div>
        </aside>
    </main>
</body>
</html>
